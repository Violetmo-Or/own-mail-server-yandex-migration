name: У меня получилось (опыт переезда)
description: Расскажите, как прошла установка у вас: провайдер, вариант, что пошло не так
labels: [experience]
body:
  - type: textarea
    id: story
    attributes:
      label: Что получилось и что нет
      description: Провайдер, вариант установки (A–F), сколько ящиков и писем, сколько времени заняло, какие ловушки встретились.
    validations:
      required: true
